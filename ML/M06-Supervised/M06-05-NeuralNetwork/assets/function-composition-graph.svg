<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Function composition as a computation graph</title>
  <desc id="desc">Input nodes x and y each feed intermediate nodes u equals g subscript 1 of x and y and v equals g subscript 2 of x and y. The intermediate nodes feed output node f equals g subscript 3 of u and v.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="390" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">The composed function as a graph</text>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">
    <text x="145" y="92">input variables</text>
    <text x="455" y="92">intermediate variables</text>
    <text x="770" y="92">output variable</text>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M205 145 L365 145"/>
    <path d="M205 265 L365 173"/>
    <path d="M205 145 L365 237"/>
    <path d="M205 265 L365 265"/>
    <path d="M550 158 L700 205"/>
    <path d="M550 252 L700 219"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#334155">
    <text x="272" y="129">x</text>
    <text x="272" y="202">y</text>
    <text x="272" y="236">x</text>
    <text x="272" y="293">y</text>
    <text x="623" y="173">u</text>
    <text x="623" y="252">v</text>
  </g>
  <g stroke-width="3">
    <rect x="80" y="112" width="125" height="66" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="80" y="232" width="125" height="66" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="365" y="112" width="185" height="66" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="365" y="232" width="185" height="66" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="700" y="172" width="145" height="66" rx="12" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="142" y="152" font-size="20" font-weight="700">x</text>
    <text x="142" y="272" font-size="20" font-weight="700">y</text>
    <text x="457" y="141" font-size="18" font-weight="700">u = g₁(x, y)</text>
    <text x="457" y="164" font-size="14">intermediate value</text>
    <text x="457" y="261" font-size="18" font-weight="700">v = g₂(x, y)</text>
    <text x="457" y="284" font-size="14">intermediate value</text>
    <text x="772" y="202" font-size="18" font-weight="700">f = g₃(u, v)</text>
    <text x="772" y="225" font-size="14">final value</text>
  </g>
  <path d="M80 337 H845" stroke="#cbd5e1" stroke-width="2"/>
  <text x="462" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#334155">Every arrow identifies a direct input to the function written in the destination node.</text>
</svg>
