<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">A bottom-to-top computation graph</title>
  <desc id="desc">Leaves x equals 2 and y equals 3 feed nodes u equals x plus y, v equals x times y, and final output f equals u times v, which equals 30.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Forward evaluation: compute from leaves to output</text>
  <text x="150" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#475569">leaves / inputs</text>
  <text x="460" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#475569">intermediate nodes</text>
  <text x="770" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#475569">output</text>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M205 158 L365 158"/>
    <path d="M205 298 L365 186"/>
    <path d="M205 158 L365 270"/>
    <path d="M205 298 L365 298"/>
    <path d="M550 172 L700 222"/>
    <path d="M550 282 L700 236"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#334155">
    <text x="270" y="142">x</text>
    <text x="270" y="220">y</text>
    <text x="272" y="276">x</text>
    <text x="270" y="326">y</text>
    <text x="623" y="185">u</text>
    <text x="623" y="285">v</text>
  </g>
  <g stroke-width="3">
    <rect x="75" y="125" width="130" height="66" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="75" y="265" width="130" height="66" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="365" y="125" width="185" height="66" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="365" y="265" width="185" height="66" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="700" y="195" width="145" height="66" rx="12" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="140" y="153" font-size="17" font-weight="700">x = 2</text>
    <text x="140" y="177" font-size="14">given value</text>
    <text x="140" y="293" font-size="17" font-weight="700">y = 3</text>
    <text x="140" y="317" font-size="14">given value</text>
    <text x="457" y="153" font-size="17" font-weight="700">u = x + y = 5</text>
    <text x="457" y="177" font-size="14">addition node</text>
    <text x="457" y="293" font-size="17" font-weight="700">v = xy = 6</text>
    <text x="457" y="317" font-size="14">multiplication node</text>
    <text x="772" y="223" font-size="17" font-weight="700">f = uv = 30</text>
    <text x="772" y="247" font-size="14">output node</text>
  </g>
  <path d="M70 375 H850" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#334155">
    <text x="85" y="407"><tspan font-weight="700">1.</tspan> begin with x and y</text>
    <text x="365" y="407"><tspan font-weight="700">2.</tspan> calculate u and v</text>
    <text x="665" y="407"><tspan font-weight="700">3.</tspan> calculate f</text>
  </g>
</svg>
