<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">A feedforward neural network as a sequence of tensor transformations</title>
  <desc id="desc">Three input features enter a four-unit hidden linear layer, pass through ReLU, and produce two output logits. Labels above the arrows give the batch tensor shapes, and a note explains that each row is processed by the same learned weights.</desc>
  <rect width="920" height="430" fill="white"/>
  <text x="460" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f3a5f">A Network Is a Chain of Tensor Transformations</text>
  <text x="460" y="61" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">The first dimension is the batch; every row uses the same learned parameters.</text>

  <rect x="40" y="105" width="160" height="230" rx="8" fill="#eef4fb" stroke="#4C72B0" stroke-width="2"/>
  <text x="120" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f3a5f">Input features</text>
  <circle cx="120" cy="180" r="20" fill="#4C72B0"/>
  <circle cx="120" cy="230" r="20" fill="#4C72B0"/>
  <circle cx="120" cy="280" r="20" fill="#4C72B0"/>
  <text x="120" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white">x₁</text>
  <text x="120" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white">x₂</text>
  <text x="120" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white">x₃</text>
  <text x="120" y="319" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">X: (batch, 3)</text>

  <line x1="200" y1="220" x2="282" y2="220" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="241" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Linear(3, 4)</text>

  <rect x="290" y="105" width="160" height="230" rx="8" fill="#fdf3ec" stroke="#DD8452" stroke-width="2"/>
  <text x="370" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f3a5f">Hidden values</text>
  <circle cx="370" cy="170" r="17" fill="#DD8452"/>
  <circle cx="370" cy="213" r="17" fill="#DD8452"/>
  <circle cx="370" cy="256" r="17" fill="#DD8452"/>
  <circle cx="370" cy="299" r="17" fill="#DD8452"/>
  <text x="370" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">H: (batch, 4)</text>

  <line x1="450" y1="220" x2="532" y2="220" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="491" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">ReLU</text>

  <rect x="540" y="105" width="130" height="230" rx="8" fill="#edf7f0" stroke="#55A868" stroke-width="2"/>
  <text x="605" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f3a5f">Activated</text>
  <circle cx="605" cy="170" r="17" fill="#55A868"/>
  <circle cx="605" cy="213" r="17" fill="#55A868"/>
  <circle cx="605" cy="256" r="17" fill="#55A868"/>
  <circle cx="605" cy="299" r="17" fill="#55A868"/>
  <text x="605" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">A: (batch, 4)</text>

  <line x1="670" y1="220" x2="742" y2="220" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="706" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Linear(4, 2)</text>

  <rect x="750" y="105" width="130" height="230" rx="8" fill="#f8eeee" stroke="#C44E52" stroke-width="2"/>
  <text x="815" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f3a5f">Output</text>
  <circle cx="815" cy="200" r="22" fill="#C44E52"/>
  <circle cx="815" cy="260" r="22" fill="#C44E52"/>
  <text x="815" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white">z₁</text>
  <text x="815" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white">z₂</text>
  <text x="815" y="319" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Z: (batch, 2)</text>

  <rect x="170" y="365" width="580" height="42" rx="8" fill="#f7f7f7" stroke="#777777"/>
  <text x="460" y="391" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333">Only Linear layers own weights and biases; ReLU changes values but has no trainable parameters.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
</svg>

