<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Instantaneous acceleration tangent to a curve</title>
  <desc id="desc">A curve with four points and orange arrows tangent to the curve at those points.</desc>
