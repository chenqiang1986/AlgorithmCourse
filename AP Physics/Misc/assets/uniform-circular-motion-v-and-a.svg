<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Velocity and acceleration in uniform circular motion</title>
  <desc id="desc">A particle moves counterclockwise through one quarter of a circle. Green velocity vectors are tangent to the circle at the initial and final positions. Orange acceleration vectors point inward toward the center.</desc>
  <defs>
    <marker id="blackArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#333"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#e65100"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#1565c0"/></marker>
  </defs>
  <rect width="720" height="400" fill="white"/>
  <g transform="translate(-70 0)">
  <circle cx="370" cy="215" r="120" fill="none" stroke="#333" stroke-width="4"/>
  <path d="M498,215 A128,128 0 0,0 370,87" fill="none" stroke="#333" stroke-width="4" marker-end="url(#blackArrow)"/>
  <circle cx="370" cy="215" r="5" fill="#333"/>
  <text x="380" y="235" font-family="Arial, sans-serif" font-size="19" fill="#333">center</text>
  <circle cx="490" cy="215" r="9" fill="#222"/>
  <circle cx="370" cy="95" r="9" fill="#222"/>
  <text x="440" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">t = 0</text>
  <text x="325" y="73" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">t = 1.0 s</text>
  <line x1="490" y1="215" x2="490" y2="120" stroke="#2e7d32" stroke-width="5" marker-end="url(#greenArrow)"/>
  <line x1="370" y1="95" x2="275" y2="95" stroke="#2e7d32" stroke-width="5" marker-end="url(#greenArrow)"/>
  <text x="500" y="154" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">v(0)</text>
  <text x="267" y="83" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">v(1)</text>
  <line x1="490" y1="215" x2="388" y2="215" stroke="#e65100" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <line x1="370" y1="95" x2="370" y2="197" stroke="#e65100" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <text x="414" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e65100">a(0)</text>
  <text x="382" y="161" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e65100">a(1)</text>
  <line x1="483" y1="206" x2="379" y2="102" stroke="#1565c0" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#blueArrow)"/>
  <text x="430" y="142" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1565c0">Δr</text>
  </g>
  <g transform="translate(10 0)">
  <circle cx="610" cy="210" r="95" fill="none" stroke="#555" stroke-width="4"/>
  <circle cx="610" cy="115" r="7" fill="#222"/>
  <circle cx="515" cy="210" r="7" fill="#222"/>
  <line x1="610" y1="210" x2="610" y2="115" stroke="#2e7d32" stroke-width="4" marker-end="url(#greenArrow)"/>
  <line x1="610" y1="210" x2="515" y2="210" stroke="#2e7d32" stroke-width="4" marker-end="url(#greenArrow)"/>
  <circle cx="610" cy="210" r="5" fill="#333"/>
  <line x1="610" y1="115" x2="515" y2="210" stroke="#1565c0" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#blueArrow)"/>
  <line x1="610" y1="115" x2="535" y2="115" stroke="#e65100" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <line x1="515" y1="210" x2="515" y2="285" stroke="#e65100" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <text x="618" y="171" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">v(0)</text>
  <text x="548" y="202" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">v(1)</text>
  <text x="550" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1565c0">Δv</text>
  <text x="540" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">a(0)</text>
  <text x="524" y="304" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">a(1)</text>
  <text x="541" y="335" font-family="Arial, sans-serif" font-size="19" fill="#333">velocity-tip curve</text>
  </g>
</svg>
