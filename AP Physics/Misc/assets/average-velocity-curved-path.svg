<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Displacement between two positions on a curved path</title>
  <desc id="desc">A curved path r of a moving object, initial and final position points, and a straight displacement arrow from initial to final position.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#1565c0"/></marker>
  </defs>
  <rect width="720" height="360" fill="white"/>
  <path d="M238,221 C300,85 400,330 555,104" fill="none" stroke="#333" stroke-width="5"/>
  <text x="325" y="306" font-family="Arial, sans-serif" font-size="20" fill="#333">path r(t)</text>
  <circle cx="238" cy="221" r="10" fill="#222"/>
  <circle cx="555" cy="104" r="10" fill="#222"/>
  <text x="210" y="253" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#222">r_i</text>
  <text x="565" y="101" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#222">r_f</text>
  <line x1="250" y1="214" x2="542" y2="108" stroke="#1565c0" stroke-width="5" marker-end="url(#blueArrow)"/>
  <text x="346" y="138" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1565c0">displacement</text>
  <text x="384" y="163" font-family="Arial, sans-serif" font-size="20" fill="#1565c0">Δr</text>
</svg>
