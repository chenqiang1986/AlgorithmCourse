<svg width="700" height="380" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <text x="350" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f3a5f">Combining Like Terms</text>
  <text x="350" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Only tiles of the same type can be grouped together</text>

  <!-- Panel 1: Before -->
  <rect x="20" y="70" width="310" height="280" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.5"/>
  <text x="175" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f3a5f">Before: Mixed Order</text>
  <text x="175" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333">3x + 5 + x + 3</text>

  <rect x="40" y="150" width="65" height="40" rx="6" fill="#4C72B0"/>
  <text x="72.5" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">3x</text>

  <rect x="115" y="150" width="45" height="40" rx="6" fill="#DD8452"/>
  <text x="137.5" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">5</text>

  <rect x="170" y="150" width="40" height="40" rx="6" fill="#4C72B0"/>
  <text x="190" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">x</text>

  <rect x="220" y="150" width="45" height="40" rx="6" fill="#DD8452"/>
  <text x="242.5" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">3</text>

  <text x="175" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#333333">scattered — not yet grouped</text>

  <!-- legend -->
  <rect x="55" y="290" width="18" height="18" rx="3" fill="#4C72B0"/>
  <text x="80" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">x-terms</text>
  <rect x="55" y="315" width="18" height="18" rx="3" fill="#DD8452"/>
  <text x="80" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">constant terms</text>

  <!-- Panel 2: After -->
  <rect x="370" y="70" width="310" height="280" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.5"/>
  <text x="525" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f3a5f">After: Grouped by Type</text>

  <rect x="390" y="140" width="70" height="40" rx="6" fill="#4C72B0"/>
  <text x="425" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">3x</text>

  <rect x="470" y="140" width="40" height="40" rx="6" fill="#4C72B0"/>
  <text x="490" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">x</text>

  <path d="M390,190 L390,196 L510,196 L510,190" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f">3x + x = 4x</text>

  <rect x="530" y="140" width="50" height="40" rx="6" fill="#DD8452"/>
  <text x="555" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">5</text>

  <rect x="590" y="140" width="50" height="40" rx="6" fill="#DD8452"/>
  <text x="615" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">3</text>

  <path d="M530,190 L530,196 L640,196 L640,190" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="585" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f">5 + 3 = 8</text>

  <text x="525" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f">Simplified: 4x + 8</text>

  <text x="350" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Like terms have the exact same variable part — combine their coefficients; unlike terms stay separate.</text>
</svg>
