<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="axisArrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="distArrowBlueS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C72B0"/>
    </marker>
    <marker id="distArrowOrangeS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD8452"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <text x="350" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f">a - b is the signed distance from b to a: right = positive (blue), left = negative (orange)</text>

  <!-- Panel A: Bigger - Smaller -->
  <g transform="translate(15,40)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Bigger - Smaller</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowS)" marker-end="url(#axisArrowS)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="2"/><text x="10" y="122" text-anchor="middle" font-weight="bold">2</text>
      <line x1="72" y1="94" x2="72" y2="106" stroke="#333333" stroke-width="1.5"/><text x="72" y="122" text-anchor="middle">3</text>
      <line x1="134" y1="94" x2="134" y2="106" stroke="#333333" stroke-width="1.5"/><text x="134" y="122" text-anchor="middle">4</text>
      <line x1="196" y1="94" x2="196" y2="106" stroke="#333333" stroke-width="1.5"/><text x="196" y="122" text-anchor="middle">5</text>
      <line x1="258" y1="94" x2="258" y2="106" stroke="#333333" stroke-width="1.5"/><text x="258" y="122" text-anchor="middle">6</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">7</text>
    </g>
    <text x="10" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">b</text>
    <text x="320" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">a</text>
    <line x1="14" y1="68" x2="316" y2="68" stroke="#4C72B0" stroke-width="2.5" marker-end="url(#distArrowBlueS)"/>
    <text x="165" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C72B0">7 - 2 = 5</text>
    <circle cx="10" cy="100" r="5" fill="#333333"/>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
  </g>

  <!-- Panel B: Smaller - Bigger -->
  <g transform="translate(365,40)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Smaller - Bigger</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowS)" marker-end="url(#axisArrowS)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="2"/><text x="10" y="122" text-anchor="middle" font-weight="bold">2</text>
      <line x1="72" y1="94" x2="72" y2="106" stroke="#333333" stroke-width="1.5"/><text x="72" y="122" text-anchor="middle">3</text>
      <line x1="134" y1="94" x2="134" y2="106" stroke="#333333" stroke-width="1.5"/><text x="134" y="122" text-anchor="middle">4</text>
      <line x1="196" y1="94" x2="196" y2="106" stroke="#333333" stroke-width="1.5"/><text x="196" y="122" text-anchor="middle">5</text>
      <line x1="258" y1="94" x2="258" y2="106" stroke="#333333" stroke-width="1.5"/><text x="258" y="122" text-anchor="middle">6</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">7</text>
    </g>
    <text x="10" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">a</text>
    <text x="320" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">b</text>
    <line x1="316" y1="68" x2="14" y2="68" stroke="#DD8452" stroke-width="2.5" marker-end="url(#distArrowOrangeS)"/>
    <text x="165" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#DD8452">2 - 7 = -5</text>
    <circle cx="10" cy="100" r="5" fill="#333333"/>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
  </g>

  <!-- Panel C: Positive - Negative -->
  <g transform="translate(15,230)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Positive - Negative</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowS)" marker-end="url(#axisArrowS)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="2"/><text x="10" y="122" text-anchor="middle" font-weight="bold">-4</text>
      <line x1="54.3" y1="94" x2="54.3" y2="106" stroke="#333333" stroke-width="1.5"/><text x="54.3" y="122" text-anchor="middle">-3</text>
      <line x1="98.6" y1="94" x2="98.6" y2="106" stroke="#333333" stroke-width="1.5"/><text x="98.6" y="122" text-anchor="middle">-2</text>
      <line x1="142.9" y1="94" x2="142.9" y2="106" stroke="#333333" stroke-width="1.5"/><text x="142.9" y="122" text-anchor="middle">-1</text>
      <line x1="187.1" y1="94" x2="187.1" y2="106" stroke="#333333" stroke-width="1.5"/><text x="187.1" y="122" text-anchor="middle">0</text>
      <line x1="231.4" y1="94" x2="231.4" y2="106" stroke="#333333" stroke-width="1.5"/><text x="231.4" y="122" text-anchor="middle">1</text>
      <line x1="275.7" y1="94" x2="275.7" y2="106" stroke="#333333" stroke-width="1.5"/><text x="275.7" y="122" text-anchor="middle">2</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">3</text>
    </g>
    <text x="10" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">b</text>
    <text x="320" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">a</text>
    <line x1="14" y1="68" x2="316" y2="68" stroke="#4C72B0" stroke-width="2.5" marker-end="url(#distArrowBlueS)"/>
    <text x="165" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C72B0">3 - (-4) = 7</text>
    <circle cx="10" cy="100" r="5" fill="#333333"/>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
  </g>

  <!-- Panel D: Negative - Positive -->
  <g transform="translate(365,230)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Negative - Positive</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowS)" marker-end="url(#axisArrowS)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="2"/><text x="10" y="122" text-anchor="middle" font-weight="bold">-3</text>
      <line x1="54.3" y1="94" x2="54.3" y2="106" stroke="#333333" stroke-width="1.5"/><text x="54.3" y="122" text-anchor="middle">-2</text>
      <line x1="98.6" y1="94" x2="98.6" y2="106" stroke="#333333" stroke-width="1.5"/><text x="98.6" y="122" text-anchor="middle">-1</text>
      <line x1="142.9" y1="94" x2="142.9" y2="106" stroke="#333333" stroke-width="1.5"/><text x="142.9" y="122" text-anchor="middle">0</text>
      <line x1="187.1" y1="94" x2="187.1" y2="106" stroke="#333333" stroke-width="1.5"/><text x="187.1" y="122" text-anchor="middle">1</text>
      <line x1="231.4" y1="94" x2="231.4" y2="106" stroke="#333333" stroke-width="1.5"/><text x="231.4" y="122" text-anchor="middle">2</text>
      <line x1="275.7" y1="94" x2="275.7" y2="106" stroke="#333333" stroke-width="1.5"/><text x="275.7" y="122" text-anchor="middle">3</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">4</text>
    </g>
    <text x="10" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">a</text>
    <text x="320" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">b</text>
    <line x1="316" y1="68" x2="14" y2="68" stroke="#DD8452" stroke-width="2.5" marker-end="url(#distArrowOrangeS)"/>
    <text x="165" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#DD8452">-3 - 4 = -7</text>
    <circle cx="10" cy="100" r="5" fill="#333333"/>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
  </g>
</svg>
