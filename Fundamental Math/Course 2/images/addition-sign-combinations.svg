<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="axisArrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="hopArrowBlueA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C72B0"/>
    </marker>
    <marker id="hopArrowOrangeA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD8452"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <text x="350" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f">Same rule, four sign combinations: right = add positive (blue), left = add negative (orange)</text>

  <!-- Panel 1: Positive + Positive -->
  <g transform="translate(15,40)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Positive + Positive</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowA)" marker-end="url(#axisArrowA)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="1.5"/><text x="10" y="122" text-anchor="middle">0</text>
      <line x1="72" y1="94" x2="72" y2="106" stroke="#333333" stroke-width="1.5"/><text x="72" y="122" text-anchor="middle">1</text>
      <line x1="134" y1="94" x2="134" y2="106" stroke="#333333" stroke-width="2"/><text x="134" y="122" text-anchor="middle" font-weight="bold">2</text>
      <line x1="196" y1="94" x2="196" y2="106" stroke="#333333" stroke-width="1.5"/><text x="196" y="122" text-anchor="middle">3</text>
      <line x1="258" y1="94" x2="258" y2="106" stroke="#333333" stroke-width="1.5"/><text x="258" y="122" text-anchor="middle">4</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">5</text>
    </g>
    <path d="M 134 95 Q 227 55 316 95" fill="none" stroke="#4C72B0" stroke-width="2.5" marker-end="url(#hopArrowBlueA)"/>
    <text x="227" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C72B0">+3 (right)</text>
    <circle cx="134" cy="100" r="5" fill="#333333"/>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
    <text x="165" y="148" text-anchor="middle" font-size="13" fill="#333333">2 + 3 = 5</text>
  </g>

  <!-- Panel 2: Positive + Negative -->
  <g transform="translate(365,40)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Positive + Negative</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowA)" marker-end="url(#axisArrowA)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="2"/><text x="10" y="122" text-anchor="middle" font-weight="bold">-3</text>
      <line x1="72" y1="94" x2="72" y2="106" stroke="#333333" stroke-width="1.5"/><text x="72" y="122" text-anchor="middle">-2</text>
      <line x1="134" y1="94" x2="134" y2="106" stroke="#333333" stroke-width="1.5"/><text x="134" y="122" text-anchor="middle">-1</text>
      <line x1="196" y1="94" x2="196" y2="106" stroke="#333333" stroke-width="1.5"/><text x="196" y="122" text-anchor="middle">0</text>
      <line x1="258" y1="94" x2="258" y2="106" stroke="#333333" stroke-width="1.5"/><text x="258" y="122" text-anchor="middle">1</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">2</text>
    </g>
    <path d="M 320 95 Q 165 55 14 95" fill="none" stroke="#DD8452" stroke-width="2.5" marker-end="url(#hopArrowOrangeA)"/>
    <text x="165" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#DD8452">-5 (left)</text>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
    <circle cx="10" cy="100" r="5" fill="#333333"/>
    <text x="165" y="148" text-anchor="middle" font-size="13" fill="#333333">2 + (-5) = -3</text>
  </g>

  <!-- Panel 3: Negative + Positive -->
  <g transform="translate(15,230)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Negative + Positive</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowA)" marker-end="url(#axisArrowA)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="2"/><text x="10" y="122" text-anchor="middle" font-weight="bold">-4</text>
      <line x1="61.7" y1="94" x2="61.7" y2="106" stroke="#333333" stroke-width="1.5"/><text x="61.7" y="122" text-anchor="middle">-3</text>
      <line x1="113.3" y1="94" x2="113.3" y2="106" stroke="#333333" stroke-width="1.5"/><text x="113.3" y="122" text-anchor="middle">-2</text>
      <line x1="165" y1="94" x2="165" y2="106" stroke="#333333" stroke-width="1.5"/><text x="165" y="122" text-anchor="middle">-1</text>
      <line x1="216.7" y1="94" x2="216.7" y2="106" stroke="#333333" stroke-width="1.5"/><text x="216.7" y="122" text-anchor="middle">0</text>
      <line x1="268.3" y1="94" x2="268.3" y2="106" stroke="#333333" stroke-width="1.5"/><text x="268.3" y="122" text-anchor="middle">1</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">2</text>
    </g>
    <path d="M 10 95 Q 165 45 316 95" fill="none" stroke="#4C72B0" stroke-width="2.5" marker-end="url(#hopArrowBlueA)"/>
    <text x="165" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C72B0">+6 (right)</text>
    <circle cx="10" cy="100" r="5" fill="#333333"/>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
    <text x="165" y="148" text-anchor="middle" font-size="13" fill="#333333">-4 + 6 = 2</text>
  </g>

  <!-- Panel 4: Negative + Negative -->
  <g transform="translate(365,230)" font-family="Helvetica, Arial, sans-serif">
    <text x="165" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a5f">Negative + Negative</text>
    <line x1="10" y1="100" x2="320" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowA)" marker-end="url(#axisArrowA)"/>
    <g font-size="12" fill="#333333">
      <line x1="10" y1="94" x2="10" y2="106" stroke="#333333" stroke-width="2"/><text x="10" y="122" text-anchor="middle" font-weight="bold">-5</text>
      <line x1="113.3" y1="94" x2="113.3" y2="106" stroke="#333333" stroke-width="1.5"/><text x="113.3" y="122" text-anchor="middle">-4</text>
      <line x1="216.7" y1="94" x2="216.7" y2="106" stroke="#333333" stroke-width="1.5"/><text x="216.7" y="122" text-anchor="middle">-3</text>
      <line x1="320" y1="94" x2="320" y2="106" stroke="#333333" stroke-width="2"/><text x="320" y="122" text-anchor="middle" font-weight="bold">-2</text>
    </g>
    <path d="M 320 95 Q 165 55 14 95" fill="none" stroke="#DD8452" stroke-width="2.5" marker-end="url(#hopArrowOrangeA)"/>
    <text x="165" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#DD8452">-3 (left)</text>
    <circle cx="320" cy="100" r="5" fill="#333333"/>
    <circle cx="10" cy="100" r="5" fill="#333333"/>
    <text x="165" y="148" text-anchor="middle" font-size="13" fill="#333333">-2 + (-3) = -5</text>
  </g>
</svg>
