<svg width="760" height="255" viewBox="0 0 760 255" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="255" fill="#ffffff"/>

  <!-- divider between the two examples -->
  <line x1="300" y1="38" x2="300" y2="205" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Panel A: 1 pizza cut into fifths -->
  <text x="140" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3a5f">How many 1/5's fit in 1 pizza?</text>

  <path d="M140,120 L140,50 A70,70 0 0,1 206.58,98.37 Z" fill="#dbe7f7" stroke="#333333" stroke-width="1"/>
  <path d="M140,120 L206.58,98.37 A70,70 0 0,1 181.15,176.63 Z" fill="#eef3fb" stroke="#333333" stroke-width="1"/>
  <path d="M140,120 L181.15,176.63 A70,70 0 0,1 98.85,176.63 Z" fill="#dbe7f7" stroke="#333333" stroke-width="1"/>
  <path d="M140,120 L98.85,176.63 A70,70 0 0,1 73.42,98.37 Z" fill="#eef3fb" stroke="#333333" stroke-width="1"/>
  <path d="M140,120 L73.42,98.37 A70,70 0 0,1 140,50 Z" fill="#dbe7f7" stroke="#333333" stroke-width="1"/>
  <circle cx="140" cy="120" r="70" fill="none" stroke="#c9974f" stroke-width="5"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">
    <text x="166.45" y="88.59">1</text>
    <text x="182.80" y="138.91">2</text>
    <text x="140" y="169">3</text>
    <text x="97.20" y="138.91">4</text>
    <text x="113.55" y="88.59">5</text>
  </g>

  <text x="140" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">1 &#247; 1/5 = 5</text>

  <!-- Panel B: 3 pizzas, each cut into fifths -->
  <text x="545" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3a5f">How many 1/5's fit in 3 pizzas?</text>

  <!-- mini pizza 1, cx=430 -->
  <path d="M430,120 L430,78 A42,42 0 0,1 469.95,107.02 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <path d="M430,120 L469.95,107.02 A42,42 0 0,1 454.69,153.98 Z" fill="#eef3fb" stroke="#333333" stroke-width="0.8"/>
  <path d="M430,120 L454.69,153.98 A42,42 0 0,1 405.31,153.98 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <path d="M430,120 L405.31,153.98 A42,42 0 0,1 390.05,107.02 Z" fill="#eef3fb" stroke="#333333" stroke-width="0.8"/>
  <path d="M430,120 L390.05,107.02 A42,42 0 0,1 430,78 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <circle cx="430" cy="120" r="42" fill="none" stroke="#c9974f" stroke-width="4"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1f3a5f" text-anchor="middle">
    <text x="446.46" y="100.35">1</text>
    <text x="456.63" y="131.65">2</text>
    <text x="430" y="151">3</text>
    <text x="403.37" y="131.65">4</text>
    <text x="413.54" y="100.35">5</text>
  </g>

  <!-- mini pizza 2, cx=545 -->
  <path d="M545,120 L545,78 A42,42 0 0,1 584.95,107.02 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <path d="M545,120 L584.95,107.02 A42,42 0 0,1 569.69,153.98 Z" fill="#eef3fb" stroke="#333333" stroke-width="0.8"/>
  <path d="M545,120 L569.69,153.98 A42,42 0 0,1 520.31,153.98 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <path d="M545,120 L520.31,153.98 A42,42 0 0,1 505.05,107.02 Z" fill="#eef3fb" stroke="#333333" stroke-width="0.8"/>
  <path d="M545,120 L505.05,107.02 A42,42 0 0,1 545,78 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <circle cx="545" cy="120" r="42" fill="none" stroke="#c9974f" stroke-width="4"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1f3a5f" text-anchor="middle">
    <text x="561.46" y="100.35">6</text>
    <text x="571.63" y="131.65">7</text>
    <text x="545" y="151">8</text>
    <text x="518.37" y="131.65">9</text>
    <text x="528.54" y="100.35">10</text>
  </g>

  <!-- mini pizza 3, cx=660 -->
  <path d="M660,120 L660,78 A42,42 0 0,1 699.95,107.02 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <path d="M660,120 L699.95,107.02 A42,42 0 0,1 684.69,153.98 Z" fill="#eef3fb" stroke="#333333" stroke-width="0.8"/>
  <path d="M660,120 L684.69,153.98 A42,42 0 0,1 635.31,153.98 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <path d="M660,120 L635.31,153.98 A42,42 0 0,1 620.05,107.02 Z" fill="#eef3fb" stroke="#333333" stroke-width="0.8"/>
  <path d="M660,120 L620.05,107.02 A42,42 0 0,1 660,78 Z" fill="#dbe7f7" stroke="#333333" stroke-width="0.8"/>
  <circle cx="660" cy="120" r="42" fill="none" stroke="#c9974f" stroke-width="4"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1f3a5f" text-anchor="middle">
    <text x="676.46" y="100.35">11</text>
    <text x="686.63" y="131.65">12</text>
    <text x="660" y="151">13</text>
    <text x="633.37" y="131.65">14</text>
    <text x="643.54" y="100.35">15</text>
  </g>

  <text x="545" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">3 &#247; 1/5 = 3 &#215; 5 = 15</text>

  <text x="380" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">In general: dividing by 1/b counts how many b-ths fit into the amount, so a &#247; 1/b = a &#215; b.</text>
</svg>
