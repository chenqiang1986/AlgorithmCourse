<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
  <title id="title">Two congruent circles embedded in a rectangle</title>
  <desc id="desc">Two equal circles sit side by side inside a rectangle, tangent to each other and to the rectangle. Each radius is r. The rectangle has width 2r and length 4r.</desc>
  <rect width="760" height="370" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#172c44">Two circular fountains in a rectangular plaza</text>
  <rect x="120" y="80" width="440" height="220" fill="#f8eecf" stroke="#947126" stroke-width="4"/>
  <circle cx="230" cy="190" r="110" fill="#bde7f4" stroke="#23728c" stroke-width="4"/>
  <circle cx="450" cy="190" r="110" fill="#bde7f4" stroke="#23728c" stroke-width="4"/>
  <circle cx="230" cy="190" r="4" fill="#172c44"/>
  <line x1="230" y1="190" x2="340" y2="190" stroke="#c34b28" stroke-width="4"/>
  <text x="285" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#812c15">r</text>
  <line x1="120" y1="325" x2="560" y2="325" stroke="#947126" stroke-width="2"/>
  <line x1="120" y1="317" x2="120" y2="333" stroke="#947126" stroke-width="2"/>
  <line x1="560" y1="317" x2="560" y2="333" stroke="#947126" stroke-width="2"/>
  <text x="340" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#735717">rectangle length = 4r</text>
  <line x1="585" y1="80" x2="585" y2="300" stroke="#947126" stroke-width="2"/>
  <line x1="577" y1="80" x2="593" y2="80" stroke="#947126" stroke-width="2"/>
  <line x1="577" y1="300" x2="593" y2="300" stroke="#947126" stroke-width="2"/>
  <text x="610" y="184" font-family="Arial, sans-serif" font-size="21" fill="#735717">width</text>
  <text x="610" y="210" font-family="Arial, sans-serif" font-size="21" fill="#735717">= 2r</text>
</svg>
