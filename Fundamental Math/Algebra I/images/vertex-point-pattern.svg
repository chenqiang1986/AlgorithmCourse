<title id="t">Point pattern from a quadratic vertex</title><desc id="d">A graph of one half times x minus two squared minus one, showing horizontal distances one, two, and three from the vertex and the corresponding vertical changes.</desc><rect width="640" height="390" fill="white"/><text x="320" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Quick Point Pattern: y = ½(x − 2)² − 1</text><g stroke="#dbe3eb"><path d="M65 65V330M145 65V330M225 65V330M305 65V330M385 65V330M465 65V330M545 65V330M45 100H580M45 150H580M45 200H580M45 250H580M45 300H580"/></g><g stroke="#27364a" stroke-width="1.7"><path d="M45 250H590M145 340V55"/></g><path d="M65 75Q305 525 545 75" fill="none" stroke="#2878b5" stroke-width="4"/><path d="M305 65V330" stroke="#8b5ca7" stroke-width="2" stroke-dasharray="7 6"/><g fill="#d1533d" stroke="white" stroke-width="2"><circle cx="65" cy="75" r="5"/><circle cx="145" cy="200" r="5"/><circle cx="225" cy="275" r="5"/><circle cx="305" cy="300" r="6"/><circle cx="385" cy="275" r="5"/><circle cx="465" cy="200" r="5"/><circle cx="545" cy="75" r="5"/></g><g font-family="Arial, sans-serif" font-size="14" fill="#26384c"><text x="313" y="322" font-weight="bold">vertex (2, −1)</text><text x="222" y="264">±1 → +½</text><text x="130" y="190">±2 → +2</text><text x="51" y="102">±3 → +9/2</text><text x="313" y="86" fill="#71478b">axis: x = 2</text><text x="320" y="370" text-anchor="middle">Use the same vertical change at equal distances on both sides of the vertex.</text></g></svg>
