<svg width="560" height="380" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>

  <text x="280" y="26" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Rule of Sarrus — Negative Diagonals</text>
  <text x="280" y="44" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">perpendicular to the main diagonal &#8212; subtract these three products</text>

  <!-- group labels -->
  <text x="155" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#666666" text-anchor="middle">original matrix</text>
  <text x="367.5" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#666666" text-anchor="middle">columns 1&#8211;2 repeated</text>

  <!-- box around the true 3x3 matrix -->
  <rect x="35" y="75" width="240" height="220" fill="none" stroke="#333333" stroke-width="2" rx="10"/>
  <!-- divider marking where the repeat begins -->
  <line x1="282.5" y1="68" x2="282.5" y2="302" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- negative (orange, dashed) diagonals -->
  <polyline points="240,110 155,185 70,260" fill="none" stroke="#DD8452" stroke-width="3.5" stroke-dasharray="9,6"/>
  <polyline points="325,110 240,185 155,260" fill="none" stroke="#DD8452" stroke-width="3.5" stroke-dasharray="9,6"/>
  <polyline points="410,110 325,185 240,260" fill="none" stroke="#DD8452" stroke-width="3.5" stroke-dasharray="9,6"/>

  <!-- grid values: row 1 -->
  <text x="70" y="118" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">a&#8321;</text>
  <text x="155" y="118" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">b&#8321;</text>
  <text x="240" y="118" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">c&#8321;</text>
  <text x="325" y="118" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">a&#8321;</text>
  <text x="410" y="118" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">b&#8321;</text>

  <!-- grid values: row 2 -->
  <text x="70" y="193" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">a&#8322;</text>
  <text x="155" y="193" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">b&#8322;</text>
  <text x="240" y="193" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">c&#8322;</text>
  <text x="325" y="193" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">a&#8322;</text>
  <text x="410" y="193" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">b&#8322;</text>

  <!-- grid values: row 3 -->
  <text x="70" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">a&#8323;</text>
  <text x="155" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">b&#8323;</text>
  <text x="240" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111" text-anchor="middle">c&#8323;</text>
  <text x="325" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">a&#8323;</text>
  <text x="410" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#999999" text-anchor="middle">b&#8323;</text>

  <!-- legend -->
  <circle cx="50" cy="330" r="6" fill="#DD8452"/>
  <text x="64" y="335" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7a3d17">&#8722; a&#8321;c&#8322;b&#8323;&#160;&#160;&#160;&#8722; b&#8321;a&#8322;c&#8323;&#160;&#160;&#160;&#8722; c&#8321;b&#8322;a&#8323;</text>

  <text x="280" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">each diagonal multiplies one entry from every row and every column</text>
</svg>
