<path d="M80 365Q260 -195 440 365" fill="none" stroke="#2878b5" stroke-width="4"/><path d="M260 60V365" stroke="#8b5ca7" stroke-width="2" stroke-dasharray="7 6"/><text x="268" y="82" font-family="Arial, sans-serif" font-size="14" fill="#71478b">axis: x = −1</text><g fill="#d1533d" stroke="white" stroke-width="2"><circle cx="80" cy="365" r="6"/><circle cx="170" cy="155" r="6"/><circle cx="260" cy="85" r="6"/><circle cx="350" cy="155" r="6"/><circle cx="440" cy="365" r="6"/></g><g font-family="Arial, sans-serif" font-size="14" fill="#26384c"><text x="178" y="148">(−2, 1)</text><text x="268" y="104" font-weight="bold">vertex (−1, 3)</text><text x="358" y="148">(0, 1)</text><text x="448" y="358">(1, −5)</text><text x="88" y="358">(−3, −5)</text><text x="467" y="116" fill="#2878b5">opens downward</text></g>
