<title id="t">Graph from vertex form</title><desc id="d">The downward parabola negative two times x plus one squared plus three, with vertex negative one comma three and symmetric points.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27364a"/></marker></defs><rect width="640" height="430" fill="white"/>
