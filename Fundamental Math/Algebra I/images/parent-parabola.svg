<svg width="640" height="410" viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">The parent parabola y equals x squared</title><desc id="d">A graph of y equals x squared with its vertex, matching symmetric point pairs, and axis of symmetry.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27364a"/></marker></defs><rect width="640" height="410" fill="white"/>
<text x="320" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Parent Function: y = x²</text>
<g stroke="#dbe3eb"><path d="M80 70V350M160 70V350M240 70V350M320 70V350M400 70V350M480 70V350M560 70V350M50 100H590M50 150H590M50 200H590M50 250H590M50 300H590M50 350H590"/></g>
<g stroke="#27364a" stroke-width="1.7" fill="none"><path d="M50 300H600" marker-end="url(#a)"/><path d="M320 360V60" marker-end="url(#a)"/></g><g font-family="Arial, sans-serif" font-size="13" fill="#27364a"><text x="605" y="305">x</text><text x="326" y="64">y</text><text x="151" y="319">−2</text><text x="231" y="319">−1</text><text x="315" y="319">0</text><text x="396" y="319">1</text><text x="476" y="319">2</text></g>
<path d="M160 100Q320 500 480 100" fill="none" stroke="#2878b5" stroke-width="4"/><path d="M320 65V350" stroke="#8b5ca7" stroke-width="2" stroke-dasharray="7 6"/><text x="329" y="88" font-family="Arial, sans-serif" font-size="14" fill="#71478b">axis: x = 0</text>
<g fill="#d1533d" stroke="white" stroke-width="2"><circle cx="160" cy="100" r="6"/><circle cx="240" cy="250" r="6"/><circle cx="320" cy="300" r="6"/><circle cx="400" cy="250" r="6"/><circle cx="480" cy="100" r="6"/></g><g font-family="Arial, sans-serif" font-size="14" fill="#26384c"><text x="166" y="92">(−2, 4)</text><text x="207" y="243">(−1, 1)</text><text x="330" y="293" font-weight="bold">vertex (0, 0)</text><text x="407" y="243">(1, 1)</text><text x="488" y="92">(2, 4)</text><text x="320" y="386" text-anchor="middle">Equal horizontal distances from the axis give equal heights.</text></g>
