<svg width="720" height="280" viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">The three possible x-intercept cases for a parabola</title><desc id="d">Three mini graphs show a parabola crossing the x-axis twice, touching once, and missing the axis.</desc><rect width="720" height="280" fill="white"/><text x="360" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Roots Appear as x-Intercepts</text>
<g font-family="Arial, sans-serif" font-size="15" text-anchor="middle"><text x="125" y="58" fill="#26384c">Two real roots</text><text x="360" y="58" fill="#26384c">One repeated root</text><text x="595" y="58" fill="#26384c">No real roots</text></g><g stroke="#27364a" stroke-width="1.5"><path d="M35 180H215M125 235V75M270 180H450M360 235V75M505 180H685M595 235V75"/></g><g fill="none" stroke="#2878b5" stroke-width="4"><path d="M55 95Q125 330 195 95"/><path d="M290 95Q360 265 430 95"/><path d="M525 85Q595 175 665 85"/></g><g fill="#d1533d"><circle cx="80" cy="180" r="5"/><circle cx="170" cy="180" r="5"/><circle cx="360" cy="180" r="5"/><circle cx="595" cy="130" r="5"/></g><g font-family="Arial, sans-serif" font-size="13" fill="#26384c" text-anchor="middle"><text x="125" y="262">crosses twice</text><text x="360" y="262">touches once</text><text x="595" y="153">vertex stays above the axis</text><text x="595" y="262">never reaches the axis</text></g>
</svg>
