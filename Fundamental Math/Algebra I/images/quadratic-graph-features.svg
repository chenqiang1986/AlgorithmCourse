<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Graph of y equals x squared minus six x plus five</title>
  <desc id="desc">An upward-opening parabola with vertex at three comma negative four, axis of symmetry x equals three, x-intercepts at one and five, and y-intercept at zero and five.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27364a"/>
    </marker>
  </defs>
  <rect width="700" height="500" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1f3a5f">Graphing f(x) = x² − 6x + 5 = (x − 3)² − 4</text>

  <!-- grid: one unit horizontally is 65 pixels; one unit vertically is 35 pixels -->
  <g stroke="#dbe3eb" stroke-width="1">
    <line x1="105" y1="70" x2="105" y2="450"/><line x1="170" y1="70" x2="170" y2="450"/>
    <line x1="235" y1="70" x2="235" y2="450"/><line x1="300" y1="70" x2="300" y2="450"/>
    <line x1="365" y1="70" x2="365" y2="450"/><line x1="430" y1="70" x2="430" y2="450"/>
    <line x1="495" y1="70" x2="495" y2="450"/><line x1="560" y1="70" x2="560" y2="450"/>
    <line x1="70" y1="100" x2="625" y2="100"/><line x1="70" y1="135" x2="625" y2="135"/>
    <line x1="70" y1="170" x2="625" y2="170"/><line x1="70" y1="205" x2="625" y2="205"/>
    <line x1="70" y1="240" x2="625" y2="240"/><line x1="70" y1="275" x2="625" y2="275"/>
    <line x1="70" y1="310" x2="625" y2="310"/><line x1="70" y1="345" x2="625" y2="345"/>
    <line x1="70" y1="380" x2="625" y2="380"/><line x1="70" y1="415" x2="625" y2="415"/>
    <line x1="70" y1="450" x2="625" y2="450"/>
  </g>

  <g stroke="#27364a" stroke-width="1.8" fill="none">
    <line x1="70" y1="310" x2="635" y2="310" marker-end="url(#arrow)"/>
    <line x1="105" y1="455" x2="105" y2="60" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#27364a">
    <text x="640" y="315">x</text><text x="111" y="64">y</text>
    <text x="100" y="329">0</text><text x="165" y="329">1</text><text x="230" y="329">2</text>
    <text x="295" y="329">3</text><text x="360" y="329">4</text><text x="425" y="329">5</text><text x="490" y="329">6</text>
    <text x="82" y="139">5</text><text x="77" y="454">−4</text>
  </g>

  <line x1="300" y1="70" x2="300" y2="450" stroke="#8b5ca7" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="307" y="91" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#71478b">axis: x = 3</text>

  <path d="M 105 135 Q 300 765 495 135" fill="none" stroke="#2878b5" stroke-width="4"/>
  <g fill="#d1533d" stroke="#ffffff" stroke-width="2.5">
    <circle cx="105" cy="135" r="6"/><circle cx="170" cy="310" r="6"/><circle cx="300" cy="450" r="6"/><circle cx="430" cy="310" r="6"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#26384c">
    <text x="114" y="126">y-intercept (0, 5)</text>
    <text x="128" y="299">(1, 0)</text><text x="438" y="299">(5, 0)</text>
    <text x="312" y="444" font-weight="bold">vertex (3, −4)</text>
    <text x="492" y="157" fill="#2878b5">opens upward</text>
  </g>
</svg>
