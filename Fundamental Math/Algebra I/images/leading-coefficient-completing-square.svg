<svg width="650" height="410" viewBox="0 0 650 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Graph of two x squared minus eight x plus six</title>
  <desc id="d">An upward-opening parabola for two times x minus two squared minus two, with vertex two comma negative two, x-intercepts one and three, and y-intercept zero and six.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27364a"/></marker></defs>
  <rect width="650" height="410" fill="#fff"/>
  <text x="325" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Leading Coefficient Not 1: f(x) = 2(x − 2)² − 2</text>
  <g stroke="#dbe3eb"><path d="M120 55V335M220 55V335M320 55V335M420 55V335M520 55V335M70 40H570M70 75H570M70 110H570M70 145H570M70 180H570M70 215H570M70 250H570M70 285H570M70 320H570"/></g>
  <g stroke="#27364a" stroke-width="1.7"><path d="M70 250H580" marker-end="url(#a)"/><path d="M120 345V35" marker-end="url(#a)"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#27364a"><text x="585" y="255">x</text><text x="126" y="39">y</text><text x="115" y="269">0</text><text x="215" y="269">1</text><text x="315" y="269">2</text><text x="415" y="269">3</text><text x="515" y="269">4</text></g>
  <path d="M120 40Q320 600 520 40" fill="none" stroke="#2878b5" stroke-width="4"/><path d="M320 45V335" stroke="#8b5ca7" stroke-width="2" stroke-dasharray="7 6"/><text x="328" y="63" font-family="Arial, sans-serif" font-size="14" fill="#71478b">axis: x = 2</text>
  <g fill="#d1533d" stroke="#fff" stroke-width="2"><circle cx="120" cy="40" r="6"/><circle cx="220" cy="250" r="6"/><circle cx="320" cy="320" r="6"/><circle cx="420" cy="250" r="6"/><circle cx="520" cy="40" r="6"/></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#26384c"><text x="128" y="58">(0, 6)</text><text x="185" y="243">(1, 0)</text><text x="330" y="314" font-weight="bold">vertex (2, −2)</text><text x="428" y="243">(3, 0)</text><text x="528" y="58">(4, 6)</text></g>
