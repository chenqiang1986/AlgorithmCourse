<svg xmlns="http://www.w3.org/2000/svg" width="400" height="390" viewBox="0 0 400 390" role="img" aria-labelledby="title desc">
  <title id="title">Two lines intersect at (2, 3)</title>
  <desc id="desc">On an xy coordinate plane, y equals x plus 1 and y equals negative x plus 5 cross at (2, 3).</desc>
  <rect width="400" height="390" fill="white"/>
  <g stroke="#e3e7ed" stroke-width="1">
    <path d="M40 80V360 M80 80V360 M120 80V360 M160 80V360 M200 80V360 M240 80V360 M280 80V360 M320 80V360"/>
    <path d="M40 80H320 M40 120H320 M40 160H320 M40 200H320 M40 240H320 M40 280H320 M40 320H320 M40 360H320"/>
  </g>
  <g stroke="#343a40" stroke-width="2" fill="none">
    <path d="M36 320H340 M80 365V62"/>
    <path d="m340 320 -8 -4 m8 4 -8 4 M80 62 l-4 8 m4 -8 4 8"/>
  </g>
  <g fill="#343a40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="40" y="340">−1</text><text x="80" y="340">0</text>
    <text x="120" y="340">1</text><text x="160" y="340">2</text>
    <text x="200" y="340">3</text><text x="240" y="340">4</text>
    <text x="280" y="340">5</text><text x="320" y="340">6</text>
    <text x="63" y="285">1</text><text x="63" y="245">2</text>
    <text x="63" y="205">3</text><text x="63" y="165">4</text>
    <text x="63" y="125">5</text><text x="63" y="85">6</text>
    <text x="353" y="325">x</text><text x="80" y="50">y</text>
  </g>
  <path d="M40 320 280 80" fill="none" stroke="#1265a8" stroke-width="3"/>
  <path d="M80 120 320 360" fill="none" stroke="#c44932" stroke-width="3"/>
  <circle cx="160" cy="200" r="6" fill="#17202a" stroke="white" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="bold">
    <text x="247" y="105" fill="#1265a8">y = x + 1</text>
    <text x="219" y="266" fill="#c44932">y = −x + 5</text>
    <text x="172" y="190" fill="#17202a">(2, 3)</text>
  </g>
</svg>
