<svg width="480" height="110" viewBox="0 0 480 110" xmlns="http://www.w3.org/2000/svg">
  <title>Stars and bars example: 7 stars, 3 bars, 4 boxes</title>
  <rect x="0" y="0" width="480" height="110" fill="#ffffff"/>

  <!-- stars -->
  <text x="40"  y="48" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#b45309">&#9733;</text>
  <text x="82"  y="48" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#b45309">&#9733;</text>
  <text x="166" y="48" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#b45309">&#9733;</text>
  <text x="208" y="48" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#b45309">&#9733;</text>
  <text x="250" y="48" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#b45309">&#9733;</text>
  <text x="376" y="48" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#b45309">&#9733;</text>
  <text x="418" y="48" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#b45309">&#9733;</text>

  <!-- bars -->
  <rect x="122" y="20" width="4" height="34" rx="1" fill="#6b7280"/>
  <rect x="290" y="20" width="4" height="34" rx="1" fill="#6b7280"/>
  <rect x="332" y="20" width="4" height="34" rx="1" fill="#6b7280"/>

  <!-- box span lines -->
  <line x1="19"  y1="65" x2="124" y2="65" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="124" y1="65" x2="292" y2="65" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="292" y1="65" x2="334" y2="65" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="334" y1="65" x2="439" y2="65" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- tick marks at box boundaries -->
  <line x1="19"  y1="61" x2="19"  y2="69" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="124" y1="61" x2="124" y2="69" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="292" y1="61" x2="292" y2="69" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="334" y1="61" x2="334" y2="69" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="439" y1="61" x2="439" y2="69" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- box labels -->
  <text x="71"  y="90" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4b5563">box 1</text>
  <text x="208" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4b5563">box 2</text>
  <text x="313" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4b5563">box 3</text>
  <text x="386" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4b5563">box 4</text>

  <!-- counts -->
  <text x="71"  y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9ca3af">2 stars</text>
  <text x="208" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9ca3af">3 stars</text>
  <text x="313" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9ca3af">0 stars</text>
  <text x="386" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9ca3af">2 stars</text>
</svg>
