<svg width="560" height="270" viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="560" height="270" fill="#ffffff"/>

  <!-- Panel 1: pizza cut into 3 pieces, 1 shaded -->
  <text x="140" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3a5f">Cut into 3, keep 1</text>

  <path d="M140,130 L140.0,60.0 A70,70 0 0,1 200.62,165.0 Z" fill="#DD8452" stroke="#333333" stroke-width="1.5"/>
  <path d="M140,130 L200.62,165.0 A70,70 0 0,1 79.38,165.0 Z" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <path d="M140,130 L79.38,165.0 A70,70 0 0,1 140.0,60.0 Z" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <circle cx="140" cy="130" r="70" fill="none" stroke="#c9974f" stroke-width="5"/>
  <text x="163" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1/3</text>
  <text x="140" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">1 shaded slice of 3</text>

  <text x="285" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#333333">=</text>

  <!-- Panel 2: same pizza, every slice cut in half -> 6 pieces, 2 shaded -->
  <text x="430" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3a5f">Cut every piece in half</text>

  <path d="M430,130 L430.0,60.0 A70,70 0 0,1 490.62,95.0 Z" fill="#DD8452" stroke="#333333" stroke-width="1.5"/>
  <path d="M430,130 L490.62,95.0 A70,70 0 0,1 490.62,165.0 Z" fill="#DD8452" stroke="#333333" stroke-width="1.5"/>
  <path d="M430,130 L490.62,165.0 A70,70 0 0,1 430.0,200.0 Z" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <path d="M430,130 L430.0,200.0 A70,70 0 0,1 369.38,165.0 Z" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <path d="M430,130 L369.38,165.0 A70,70 0 0,1 369.38,95.0 Z" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <path d="M430,130 L369.38,95.0 A70,70 0 0,1 430.0,60.0 Z" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <circle cx="430" cy="130" r="70" fill="none" stroke="#c9974f" stroke-width="5"/>
  <line x1="430" y1="130" x2="430" y2="60" stroke="#333333" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="430" y1="130" x2="490.62" y2="165" stroke="#333333" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="430" y1="130" x2="369.38" y2="165" stroke="#333333" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="453" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">2/6</text>
  <text x="430" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">2 shaded slices of 6</text>

  <text x="280" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">Same shaded area, twice as many cuts: 1/3 = (1&#215;2)/(3&#215;2) = 2/6.</text>
</svg>
