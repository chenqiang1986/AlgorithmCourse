<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="axisArrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="hopArrowBlueD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C72B0"/>
    </marker>
    <marker id="hopArrowOrangeD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD8452"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="220" fill="#ffffff"/>

  <text x="350" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f">(-6) + 4: negative hop moves left, then positive hop moves right</text>

  <!-- number line -->
  <line x1="40" y1="130" x2="660" y2="130" stroke="#333333" stroke-width="1.5" marker-start="url(#axisArrowD)" marker-end="url(#axisArrowD)"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">
    <line x1="40" y1="124" x2="40" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="40" y="155" text-anchor="middle">-8</text>
    <line x1="102" y1="124" x2="102" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="102" y="155" text-anchor="middle">-7</text>
    <line x1="164" y1="124" x2="164" y2="136" stroke="#333333" stroke-width="2"/>
    <text x="164" y="155" text-anchor="middle" font-weight="bold">-6</text>
    <line x1="226" y1="124" x2="226" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="226" y="155" text-anchor="middle">-5</text>
    <line x1="288" y1="124" x2="288" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="288" y="155" text-anchor="middle">-4</text>
    <line x1="350" y1="124" x2="350" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="350" y="155" text-anchor="middle">-3</text>
    <line x1="412" y1="124" x2="412" y2="136" stroke="#333333" stroke-width="2"/>
    <text x="412" y="155" text-anchor="middle" font-weight="bold">-2</text>
    <line x1="474" y1="124" x2="474" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="474" y="155" text-anchor="middle">-1</text>
    <line x1="536" y1="124" x2="536" y2="136" stroke="#333333" stroke-width="2"/>
    <text x="536" y="155" text-anchor="middle" font-weight="bold">0</text>
    <line x1="598" y1="124" x2="598" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="598" y="155" text-anchor="middle">1</text>
    <line x1="660" y1="124" x2="660" y2="136" stroke="#333333" stroke-width="1.5"/>
    <text x="660" y="155" text-anchor="middle">2</text>
  </g>

  <!-- hop 1: 0 to -6 (add -6, move left) -->
  <path d="M 536 125 Q 350 70 168 125" fill="none" stroke="#DD8452" stroke-width="2.5" marker-end="url(#hopArrowOrangeD)"/>
  <text x="350" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DD8452">-6 (left)</text>

  <!-- hop 2: -6 to -2 (add +4, move right) -->
  <path d="M 164 125 Q 288 95 408 125" fill="none" stroke="#4C72B0" stroke-width="2.5" marker-end="url(#hopArrowBlueD)"/>
  <text x="288" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4C72B0">+4 (right)</text>

  <circle cx="536" cy="130" r="5" fill="#333333"/>
  <text x="536" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">start</text>

  <circle cx="412" cy="130" r="5" fill="#333333"/>
  <text x="412" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">end</text>

  <text x="350" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">(-6) + 4 = -2</text>
</svg>
