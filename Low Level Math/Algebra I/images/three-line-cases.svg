<svg width="750" height="270" viewBox="0 0 750 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="750" height="270" fill="#ffffff"/>

  <!-- Panel A: Independent (one solution) -->
  <g transform="translate(10,0)">
    <rect x="0" y="0" width="230" height="250" fill="none" stroke="#333333" stroke-width="2" rx="8"/>
    <text x="115" y="22" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Independent</text>
    <text x="115" y="37" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">one solution</text>

    <line x1="25" y1="151.7" x2="205" y2="151.7" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="115" y1="205" x2="115" y2="45" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="208" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">x</text>
    <text x="121" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">y</text>

    <line x1="25" y1="178.3" x2="205" y2="71.7" stroke="#4C72B0" stroke-width="3"/>
    <line x1="25" y1="71.7" x2="205" y2="178.3" stroke="#DD8452" stroke-width="3"/>

    <circle cx="115" cy="125" r="4.5" fill="#333333"/>
    <text x="123" y="121" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222222">crossing point</text>

    <text x="115" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">y = x + 1  and  y = -x + 1</text>
  </g>

  <!-- Panel B: Inconsistent (no solution) -->
  <g transform="translate(260,0)">
    <rect x="0" y="0" width="230" height="250" fill="none" stroke="#333333" stroke-width="2" rx="8"/>
    <text x="115" y="22" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Inconsistent</text>
    <text x="115" y="37" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">no solution</text>

    <line x1="25" y1="125" x2="205" y2="125" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="145" y1="205" x2="145" y2="45" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="208" y="129" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">x</text>
    <text x="151" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">y</text>

    <line x1="25" y1="141" x2="205" y2="45" stroke="#4C72B0" stroke-width="3"/>
    <line x1="25" y1="205" x2="205" y2="109" stroke="#DD8452" stroke-width="3"/>

    <text x="115" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">y = 2x + 3  and  y = 2x - 1</text>
  </g>

  <!-- Panel C: Dependent (infinitely many) -->
  <g transform="translate(510,0)">
    <rect x="0" y="0" width="230" height="250" fill="none" stroke="#333333" stroke-width="2" rx="8"/>
    <text x="115" y="22" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Dependent</text>
    <text x="115" y="37" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">infinitely many solutions</text>

    <line x1="25" y1="178.3" x2="205" y2="178.3" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="145" y1="205" x2="145" y2="45" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="208" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">x</text>
    <text x="151" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">y</text>

    <line x1="25" y1="205" x2="205" y2="45" stroke="#4C72B0" stroke-width="4"/>
    <line x1="28" y1="202" x2="208" y2="42" stroke="#DD8452" stroke-width="2" stroke-dasharray="6,4"/>

    <text x="115" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">y = 2x + 3  and  2y = 4x + 6</text>
    <text x="163" y="58" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7a3d17" transform="rotate(-38 163 58)">(same line)</text>
  </g>
</svg>
